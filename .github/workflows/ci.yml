name: Django CRM API CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Step 3: Cache pipenv virtual environment
      - name: Cache pipenv dependencies
        uses: actions/cache@v3
        id: cache-pipenv
        with:
          path: ~/.cache/pipenv
          key: ${{ runner.os }}-pipenv-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pipenv-

      # Step 4: Install pipenv + dependencies (system mode)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev --system --deploy

      # Step 5: Run migrations (SQLite)
      - name: Run migrations
        run: python manage.py migrate

      # Step 6: Run test suite
      - name: Run tests
        run: python manage.py test

      # Optional: show test coverage
      #- name: Run coverage
      #  run: coverage run manage.py test && coverage report -m
